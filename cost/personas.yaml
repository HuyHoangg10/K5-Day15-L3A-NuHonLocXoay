# Mô phỏng chi phí khi dùng thật — Track F (Trợ lý đối chiếu tạm hoãn NVQS vì học tập).
# Chạy thử: python run.py simulate --try   (10 phiên, kiểm khung → cost/simulate-try.csv)
# Bản nộp CP4: python run.py simulate --rate-from eval/run-7.csv   (≥50 phiên; run-7 = lượt 2 chính thức)

sessions: 50
seed: 42

users:
  low: 500
  base: 2000
  high: 5000
  source: "Track F — quy mô thí điểm cho sinh viên nam trong độ tuổi NVQS (18–27 tuổi) tại 1–3 trường đại học trong mùa khám tuyển (tự ước tính)"

personas:
  - name: dung_it
    share: 0.24
    uses_per_month: 1
    turns_per_session: 1
    source: "khảo sát nhóm ngày 27/11/2026 (n = 24 sinh viên nam 18–27 tuổi, 21/24 đã từng tra cứu): 5/21 (23.8%) tra 1 lần/tháng, đa số 3/5 hỏi 1 câu/lần (câu 3 & 4)"
  - name: dung_vua
    share: 0.52
    uses_per_month: 3
    turns_per_session: 2
    source: "khảo sát nhóm ngày 27/11/2026 (n = 24 sinh viên nam 18–27 tuổi, 21/24 đã từng tra cứu): 11/21 (52.4%) tra 2–3 lần/tháng, 9/11 hỏi 2–3 câu/lần (câu 3 & 4)"
  - name: dung_nhieu
    share: 0.24
    uses_per_month: 4
    turns_per_session: 4
    source: "khảo sát nhóm ngày 27/11/2026 (n = 24 sinh viên nam 18–27 tuổi, 21/24 đã từng tra cứu): 5/21 (23.8%) tra ≥4 lần/tháng, 3/5 hỏi ≥4 câu/lần (câu 3 & 4)"

prices:
  - model: gpt-6.1-terra
    input: 1.00
    output: 5.00
    source: "https://developers.openai.com/api/docs/pricing (Standard, ngữ cảnh ngắn) · xem 28/11/2026"
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "https://developers.openai.com/api/docs/pricing · xem 27/11/2026"
  - model: gpt-4o
    input: 2.50
    output: 10.00
    source: "https://developers.openai.com/api/docs/pricing · xem 27/11/2026"

usd_to_vnd:
  rate: 25500
  source: "tỷ giá tham khảo USD/VND tại Việt Nam (tự ước tính) · xem 27/11/2026"
